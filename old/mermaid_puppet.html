    <!-- ==============================================
         2. アニメーションCSS（transform-box固定）
         ============================================== -->
    <style>
      /* 全アニメーションパーツの変形基準を「パーツ自身」に強制固定 */
      .mermaid-float, .mermaid-tail-sway, .mermaid-fin-flutter, .mermaid-hair-flow,
      .mermaid-arm-left, .mermaid-arm-right, .king-float, .king-tail-sway,
      .king-beard-sway, .king-trident-arm, .sister-violet-float, .violet-tail-sway,
      .violet-hair-drift, .sister-gold-float, .gold-tail-sway, .gold-hair-bounce,
      .fish-swim, .fish-tail-wag, .fish-pectoral-fin, .jelly-float,
      .tentacle-sway-1, .tentacle-sway-2, .seahorse-bob, .seahorse-fin-flutter,
      .temple-pearl-pulse, .trident-sparkle, .light-ray, .light-ray-2,
      .sway-left, .sway-right, .sway-slow {
        transform-box: fill-box;
      }

      /* 神殿の真珠発光 */
      .temple-pearl-pulse { transform-origin: 50% 50%; animation: pearlPulse 4s ease-in-out infinite alternate; }
      @keyframes pearlPulse { 0% { transform: scale(0.95); opacity: 0.85; } 100% { transform: scale(1.1); opacity: 1; } }
      .temple-light { animation: windowFlicker 5s ease-in-out infinite alternate; }
      @keyframes windowFlicker { 0% { opacity: 0.75; } 100% { opacity: 1; } }

      /* 背景・海藻・光 */
      .sway-left { transform-origin: 50% 100%; animation: swayL 5s ease-in-out infinite alternate; }
      .sway-right { transform-origin: 50% 100%; animation: swayR 6s ease-in-out infinite alternate; }
      .sway-slow { transform-origin: 50% 100%; animation: swayL 8s ease-in-out infinite alternate; }
      @keyframes swayL { 0% { transform: rotate(0deg) skewX(0deg); } 100% { transform: rotate(4deg) skewX(6deg); } }
      @keyframes swayR { 0% { transform: rotate(0deg) skewX(0deg); } 100% { transform: rotate(-5deg) skewX(-7deg); } }
      .light-ray { transform-origin: 50% 0%; animation: shimmer 7s ease-in-out infinite alternate; }
      .light-ray-2 { transform-origin: 50% 0%; animation: shimmer 9s ease-in-out infinite alternate-reverse; }
      @keyframes shimmer { 0% { opacity: 0.4; transform: scaleX(1); } 100% { opacity: 0.85; transform: scaleX(1.15); } }
      .bubble { animation: rise 6s ease-in infinite; }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.8; } 100% { transform: translateY(-750px) translateX(25px); opacity: 0; } }

      /* 人魚姫 */
      .mermaid-float { transform-origin: 50% 50%; animation: swimFloat 6s ease-in-out infinite alternate; }
      @keyframes swimFloat { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-16px) rotate(2deg); } 100% { transform: translateY(8px) rotate(-1.5deg); } }
      .mermaid-tail-sway { transform-origin: 50% 0%; animation: tailSway 4s ease-in-out infinite alternate; }
      @keyframes tailSway { 0% { transform: rotate(-5deg); } 100% { transform: rotate(7deg); } }
      .mermaid-fin-flutter { transform-origin: 50% 0%; animation: finFlutter 3s ease-in-out infinite alternate; }
      @keyframes finFlutter { 0% { transform: scaleX(0.92) rotate(-6deg); } 100% { transform: scaleX(1.08) rotate(8deg); } }
      .mermaid-hair-flow { transform-origin: 50% 0%; animation: hairFlow 5s ease-in-out infinite alternate; }
      @keyframes hairFlow { 0% { transform: rotate(-3deg) skewX(-2deg); } 100% { transform: rotate(5deg) skewX(4deg); } }
      .mermaid-arm-left { transform-origin: 100% 0%; animation: armSwayLeft 5s ease-in-out infinite alternate; }
      @keyframes armSwayLeft { 0% { transform: rotate(0deg); } 100% { transform: rotate(-8deg); } }
      .mermaid-arm-right { transform-origin: 0% 0%; animation: armSwayRight 4.5s ease-in-out infinite alternate; }
      @keyframes armSwayRight { 0% { transform: rotate(0deg); } 100% { transform: rotate(6deg); } }

      /* 海の王様 */
      .king-float { transform-origin: 50% 50%; animation: kingSwim 7s ease-in-out infinite alternate; }
      @keyframes kingSwim { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px) rotate(1deg); } 100% { transform: translateY(8px) rotate(-1deg); } }
      .king-tail-sway { transform-origin: 50% 0%; animation: kingTail 5s ease-in-out infinite alternate; }
      @keyframes kingTail { 0% { transform: rotate(-4deg); } 100% { transform: rotate(5deg); } }
      .king-beard-sway { transform-origin: 50% 0%; animation: beardWave 4s ease-in-out infinite alternate; }
      @keyframes beardWave { 0% { transform: rotate(-2deg) skewX(-2deg); } 100% { transform: rotate(3deg) skewX(3deg); } }
      .king-trident-arm { transform-origin: 0% 0%; animation: armHold 6s ease-in-out infinite alternate; }
      @keyframes armHold { 0% { transform: rotate(0deg); } 50% { transform: rotate(-2deg) translateY(-4px); } 100% { transform: rotate(2deg) translateY(3px); } }
      .trident-sparkle { transform-origin: 50% 50%; animation: sparkle 2.5s ease-in-out infinite alternate; }
      @keyframes sparkle { 0% { transform: scale(0.85); opacity: 0.5; } 100% { transform: scale(1.15); opacity: 1; } }

      /* お姉さんたち */
      .sister-violet-float { transform-origin: 50% 50%; animation: floatElegance 6.5s ease-in-out infinite alternate; }
      @keyframes floatElegance { 0% { transform: translateY(0); } 50% { transform: translateY(-14px) rotate(-1.5deg); } 100% { transform: translateY(8px) rotate(1deg); } }
      .violet-tail-sway { transform-origin: 50% 0%; animation: tailVioletSway 4.5s ease-in-out infinite alternate; }
      @keyframes tailVioletSway { 0% { transform: rotate(-5deg); } 100% { transform: rotate(6deg); } }
      .violet-hair-drift { transform-origin: 50% 0%; animation: hairDrift 5s ease-in-out infinite alternate; }

      .sister-gold-float { transform-origin: 50% 50%; animation: floatBouncy 5s ease-in-out infinite alternate; }
      @keyframes floatBouncy { 0% { transform: translateY(8px) rotate(2deg); } 50% { transform: translateY(-18px) rotate(-2deg); } 100% { transform: translateY(4px) rotate(1.5deg); } }
      .gold-tail-sway { transform-origin: 50% 0%; animation: tailGoldSway 3.5s ease-in-out infinite alternate; }
      @keyframes tailGoldSway { 0% { transform: rotate(6deg); } 100% { transform: rotate(-8deg); } }
      .gold-hair-bounce { transform-origin: 50% 0%; animation: hairBounce 4s ease-in-out infinite alternate; }
      @keyframes hairBounce { 0% { transform: rotate(-3deg) scaleY(0.98); } 100% { transform: rotate(5deg) scaleY(1.03); } }

      /* 生き物たち */
      .fish-swim { transform-origin: 50% 50%; animation: fishMove 4s ease-in-out infinite alternate; }
      @keyframes fishMove { 0% { transform: translate(0, 0) rotate(-3deg); } 50% { transform: translate(20px, -15px) rotate(4deg); } 100% { transform: translate(-8px, 12px) rotate(-2deg); } }
      .fish-tail-wag { transform-origin: 100% 50%; animation: tailWag 0.8s ease-in-out infinite alternate; }
      @keyframes tailWag { 0% { transform: rotate(-12deg); } 100% { transform: rotate(15deg); } }
      .fish-pectoral-fin { transform-origin: 0% 50%; animation: finFlap 1.2s ease-in-out infinite alternate; }
      @keyframes finFlap { 0% { transform: rotate(0deg); } 100% { transform: rotate(-25deg); } }

      .jelly-float { transform-origin: 50% 50%; animation: jellyPulse 5s ease-in-out infinite; }
      @keyframes jellyPulse { 0% { transform: translateY(15px) scale(0.95, 1.05); } 40% { transform: translateY(-25px) scale(1.08, 0.92); } 100% { transform: translateY(15px) scale(0.95, 1.05); } }
      .tentacle-sway-1 { transform-origin: 50% 0%; animation: tentacleWave1 4s ease-in-out infinite alternate; }
      .tentacle-sway-2 { transform-origin: 50% 0%; animation: tentacleWave2 3.5s ease-in-out infinite alternate-reverse; }
      @keyframes tentacleWave1 { 0% { transform: rotate(-6deg); } 100% { transform: rotate(8deg); } }
      @keyframes tentacleWave2 { 0% { transform: rotate(7deg); } 100% { transform: rotate(-9deg); } }

      .seahorse-bob { transform-origin: 50% 50%; animation: seahorseBobbing 5s ease-in-out infinite alternate; }
      @keyframes seahorseBobbing { 0% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(4deg); } 100% { transform: translateY(8px) rotate(-3deg); } }
      .seahorse-fin-flutter { transform-origin: 50% 50%; animation: fastFlutter 0.3s ease-in-out infinite alternate; }
      @keyframes fastFlutter { 0% { transform: scaleX(0.8); } 100% { transform: scaleX(1.2); } }
    </style>
  </defs>

    <!-- 右翼棟（東の尖塔群 ＆ 回廊橋） -->
